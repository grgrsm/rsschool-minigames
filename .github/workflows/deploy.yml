name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Замените на master, если основная ветка master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # ⚠️ ЕСЛИ ВСЕ ФАЙЛЫ ПРОЕКТА (package.json) ЛЕЖАТ ВО ВЛОЖЕННОЙ ПАПКЕ (например, minigames-home-page),
    # раскомментируйте строчку ниже и укажите имя этой папки:
    # defaults:
    #   run:
    #     working-directory: minigames-home-page

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Обновлено до актуальной LTS версии Node.js
          cache: 'npm'
          # ⚠️ Если package.json во вложенной папке, раскомментируйте строчку ниже:
          # cache-dependency-path: 'minigames-home-page/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and linting
        run: |
          npm run format:check
          npm run lint

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️ Если проект во вложенной папке, укажите путь относительно нее:
          # path: './minigames-home-page/dist'
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
